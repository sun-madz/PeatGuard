name: Refresh fire risk

# Runs the model every morning (06:00 MYT) with live weather + satellite fires,
# then commits web/data/*.json. Vercel redeploys automatically on the new commit.
on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 06:00 Malaysia time
  workflow_dispatch: {}      # also allows a manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas numpy requests lightgbm scikit-learn
      - name: Run the model on today's data
        env:
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
        run: python scripts/export_web.py
      - name: Commit new predictions
        run: |
          git config user.name "peatguard-bot"
          git config user.email "peatguard-bot@users.noreply.github.com"
          git add web/data
          git diff --cached --quiet || git commit -m "Daily fire-risk refresh"
          git push
